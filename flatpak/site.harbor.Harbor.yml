app-id: site.harbor.Harbor
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: harbor

sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node22

finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.mpris.MediaPlayer2.*
  - --own-name=org.mpris.MediaPlayer2.harbor
  - --own-name=org.mpris.MediaPlayer2.harbor.*
  - --filesystem=xdg-run/discord-ipc-0

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node22/bin
  env:
    CARGO_HOME: /run/build/harbor/cargo
    CARGO_NET_OFFLINE: 'true'
    npm_config_cache: /run/build/harbor/npm-cache
    CI: 'true'

modules:
  - shared-modules/libayatana-appindicator/libayatana-appindicator-gtk3.json

  - name: libass
    buildsystem: autotools
    config-opts:
      - --libdir=/app/lib
      - --disable-static
      - --enable-shared
    sources:
      - type: git
        url: https://github.com/libass/libass.git
        commit: e46aedea0a0d17da4c4ef49d84b94a7994664ab5

  - name: libplacebo
    buildsystem: meson
    config-opts:
      - --libdir=lib
      - -Ddefault_library=shared
      - -Dtests=false
      - -Ddemos=false
      - -Dopengl=enabled
    sources:
      - type: git
        url: https://github.com/haasn/libplacebo.git
        commit: 275f7dea27924cdd34ab2e6c20e448b6bc4fab65

  # mpv's on-screen controls are a built-in Lua script. Harbor's own player draws its
  # own controls, but "Play in my own mpv" opens /app/bin/mpv as a window of its own.
  - shared-modules/luajit/luajit.json

  - name: mpv
    buildsystem: meson
    config-opts:
      - --libdir=lib
      - -Dlibmpv=true
      - -Dcplayer=true
      - -Dbuild-date=false
      - -Dmanpage-build=disabled
      - -Dtests=false
      - -Dlua=luajit
      - -Djavascript=disabled
      - -Dgl=enabled
      - -Dplain-gl=enabled
      - -Degl=enabled
      - -Dwayland=enabled
      - -Degl-wayland=enabled
    sources:
      - type: git
        url: https://github.com/mpv-player/mpv.git
        commit: d32c910be63d1dd325c7b3efeaa09c3c4c8d51ce

  - name: yt-dlp
    buildsystem: simple
    build-commands:
      - install -Dm755 yt-dlp /app/bin/yt-dlp
    sources:
      - type: file
        url: https://github.com/yt-dlp/yt-dlp/releases/download/2026.06.09/yt-dlp
        sha256: e5d57466682cfa9d61e9cf7c8a4f09b00f4a62af37d3bbdc4bcffdf63615feac

  - name: harbor
    buildsystem: simple
    build-commands:
      - node flatpak-node/pnpm-cli/bin/pnpm.cjs install --offline --frozen-lockfile --trust-lockfile
      - node node_modules/@tauri-apps/cli/tauri.js build --config src-tauri/tauri.flatpak.conf.json --no-bundle
      - |
        if test -f tools/linux-hdr-probe/embedded.c; then
          make -C tools/linux-hdr-probe check embedded COLOR_XML="$PWD/hdr-wayland-protocols/staging/color-management/color-management-v1.xml"
          install -Dm755 tools/linux-hdr-probe/libharbor-linux-hdr.so /app/lib/harbor-hdr/libharbor-linux-hdr.so
        fi
      - install -Dm755 src-tauri/target/release/harbor /app/bin/harbor
      - install -Dm644 flatpak/site.harbor.Harbor.desktop /app/share/applications/site.harbor.Harbor.desktop
      - install -Dm644 flatpak/site.harbor.Harbor.metainfo.xml /app/share/metainfo/site.harbor.Harbor.metainfo.xml
      - install -Dm644 src-tauri/icons/32x32.png /app/share/icons/hicolor/32x32/apps/site.harbor.Harbor.png
      - install -Dm644 src-tauri/icons/128x128.png /app/share/icons/hicolor/128x128/apps/site.harbor.Harbor.png
      - install -Dm644 src-tauri/icons/icon.png /app/share/icons/hicolor/512x512/apps/site.harbor.Harbor.png
      - install -Dm755 /usr/bin/ffmpeg /app/bin/ffmpeg
      - install -Dm755 /usr/bin/ffprobe /app/bin/ffprobe
    sources:
      - type: dir
        path: ..
        skip:
          - .git
          - .flatpak-builder
          - .flatpak-work
          - node_modules
          - dist
          - harbor-core/target
          - src-tauri/target
      - type: git
        url: https://github.com/wayland-mirror/wayland-protocols.git
        commit: ee78491a237eaff9389a0ccf8680521d074407d3
        dest: hdr-wayland-protocols
      - type: archive
        url: https://registry.npmjs.org/pnpm/-/pnpm-11.9.0.tgz
        sha256: 2b567aa66026238078ac2e0a33bec3febd60e962987aac697456f3180819b287
        dest: flatpak-node/pnpm-cli
      - node-sources.json
      - cargo-sources.json
