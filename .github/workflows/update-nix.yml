name: Validate and update Nix packages

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "41 */6 * * *"
  pull_request:
    paths:
      - flake.nix
      - flake.lock
      - nix/**
      - .github/workflows/update-nix.yml
  push:
    branches: [main]
    paths:
      - flake.nix
      - flake.lock
      - nix/**
      - .github/workflows/update-nix.yml

permissions:
  contents: read

jobs:
  validate:
    name: Validate Nix packages
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -m unittest discover -s nix -p 'test_*.py'
      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
      - run: nix flake check --no-update-lock-file --no-write-lock-file
      - run: nix build .#beta .#stable --no-link --no-update-lock-file --no-write-lock-file

  update:
    name: Refresh published Nix packages
    # Reusable workflows retain the caller's event; run from main only.
    if: github.ref == 'refs/heads/main' && github.event_name != 'push' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: harbor-nix-metadata-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Refresh version and fixed-output hashes
        id: refresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m unittest discover -s nix -p 'test_*.py'
          python3 nix/update.py
          if git diff --quiet -- nix/version.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
        if: steps.refresh.outputs.changed == 'true'
      - name: Verify both Nix packages before publishing
        if: steps.refresh.outputs.changed == 'true'
        run: |
          set -euo pipefail
          nix flake check --no-update-lock-file --no-write-lock-file
          nix build .#beta .#stable --no-link --no-update-lock-file --no-write-lock-file
      - name: Publish verified metadata
        if: steps.refresh.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nix/version.json
          git commit -m "build(nix): refresh Harbor release metadata"
          # Other jobs can update README/Flatpak on main concurrently.
          for attempt in 1 2 3; do
            echo "Publishing Nix metadata (attempt $attempt/3)"
            git pull --rebase origin main
            # Refuse publication if a newer asset appeared during the build.
            python3 nix/update.py --check
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
